version: '3.8'

services:
  bioclip-api:
    build: .
    image: bioclip-api:latest
    container_name: bioclip-server
    restart: unless-stopped
    ports:
      - "29844:8000"
    volumes:
      - ./models:/app/models
      - ./offline_images:/app/offline_images
      - ./bioclip.html:/app/bioclip.html
      - ./kestrel.html:/app/kestrel.html  # 新增挂载
      - ./app.py:/app/app.py              # 新增挂载

#     networks:
#       - 1panel-network

